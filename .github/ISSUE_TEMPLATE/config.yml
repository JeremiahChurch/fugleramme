    url: https://github.com/tphakala/birdnet-go/issues
    about: Missed or wrong species belong with BirdNET-Go, or with the station if the frame reads BirdWeather.
  - name: Artwork you have already cut
    url: https://github.com/arnegiacomo/fugleramme/blob/main/CONTRIBUTING.md#artwork
    about: Open a PR instead - no issue needed.
